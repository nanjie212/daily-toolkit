    <!--
      内容安全策略（保守版）。改动前请先读完这段说明，否则很容易把站点打死。

      已确认的硬约束（都是实测/查过源码的，不要想当然收紧）：
      · script-src 必须带 'unsafe-eval'
        —— 计算器等 3 处用了 new Function()：
           src/components/CalculatorUI.tsx、src/pages/Developer.tsx、
           src/tools/implementations/lifeTools.ts
      · script-src 必须带 'unsafe-inline'
        —— 图片裁剪工具输出的是一整份带 <script> 的 HTML，塞进 srcdoc iframe 运行；
           srcdoc 会继承父页面的 CSP，收紧就等于把该工具打死（src/components/OutputModal.tsx）
      · style-src 必须带 'unsafe-inline'
        —— index.html 自带 inline <style>，项目里还有大量 style={{}} 内联样式
      · img-src / media-src 需要 data: 与 blob:
        —— 图片与 PDF 工具大量使用 canvas.toDataURL 与 URL.createObjectURL
      · worker-src 需要 blob:
        —— pdfjs-dist 的 worker 在部分路径下会退化成 blob worker
      · frame-src 放开 https:
        —— 意见箱 iframe 的地址来自 .env 的 VITE_FEEDBACK_FORM_URL（当前为
           https://jmtxtacy.jsjform.com/f/miYSMC），换供应商时只改 .env，
           这里写死域名会导致意见箱白屏
      · connect-src 带 ws: wss:
        —— 这份 meta 在 `npm run dev` 时同样生效，不放开会打断 Vite HMR 的 websocket

      真正在生效的零风险收紧项：object-src 'none'（禁插件）、base-uri 'self'（防 base 标签注入）、
      frame-ancestors 'none'（防点击劫持）、form-action 'self'（防表单外发）、
      以及把脚本/样式/连接的**外部来源**限制在同源。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        frame-ancestors 'none';
        form-action 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        media-src 'self' data: blob:;
        worker-src 'self' blob:;
        child-src 'self' blob:;
        manifest-src 'self';
        connect-src 'self' data: blob: ws: wss:;
        frame-src 'self' https: data: blob:;
      "
    />
